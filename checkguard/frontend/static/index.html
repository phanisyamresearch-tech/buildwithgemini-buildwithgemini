<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckGuard - Check Verification &amp; Risk Assistant</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#1d4ed8; --accent-hover:#1e40af; --accent-light:#eff6ff; --bg:#f1f5f9; --border:#e2e8f0; --text:#0f172a; --text-muted:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { background:linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%); color:#fff; padding:1rem 1.5rem; font-weight:700; font-size:1.15rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.08); z-index:10; }
  .header-brand { display:flex; align-items:center; gap:.6rem; }
  .header-badge { font-size:.75rem; font-weight:500; background:rgba(255,255,255,.2); padding:.2rem .6rem; border-radius:12px; }

  #chat-container { flex:1; display:flex; flex-direction:column; max-width:860px; width:100%; margin:0 auto; overflow:hidden; }
  #log { flex:1; overflow-y:auto; padding:1.25rem 1rem; display:flex; flex-direction:column; gap:1.25rem; }

  /* Message row with avatar and dialogue balloon */
  .msg-row { display:flex; gap:.75rem; max-width:85%; align-items:flex-start; animation:fadeIn .2s ease-out; }
  .msg-row.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.agent { align-self:flex-start; }

  .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .msg-row.agent .avatar { background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#fff; }
  .msg-row.user .avatar { background:#3b82f6; color:#fff; }

  .msg-body { display:flex; flex-direction:column; gap:.25rem; }
  .msg-row.user .msg-body { align-items:flex-end; }
  .msg-meta { font-size:.75rem; color:var(--text-muted); font-weight:500; padding:0 .2rem; }

  .bubble { padding:.75rem 1rem; border-radius:16px; background:#fff; border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,.04); line-height:1.5; font-size:.95rem; white-space:pre-wrap; }
  .msg-row.user .bubble { background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#fff; border:none; border-top-right-radius:4px; box-shadow:0 2px 6px rgba(29,78,216,.2); }
  .msg-row.agent .bubble { border-top-left-radius:4px; background:#fff; border-color:#e2e8f0; }

  /* A2UI Cards */
  .bubble.rich { background:transparent; border:none; padding:0; box-shadow:none; white-space:normal; width:100%; }

  .prompts-bar { display:flex; gap:.6rem; padding:.6rem 1.25rem; background:#fff; border-top:1px solid var(--border); overflow-x:auto; }
  .prompt-chip { background:var(--accent-light); color:var(--accent); border:1px solid #bfdbfe; border-radius:20px; padding:.45rem .95rem; font-size:.85rem; font-weight:500; cursor:pointer; white-space:nowrap; transition:all .15s ease; display:flex; align-items:center; gap:.4rem; }
  .prompt-chip:hover { background:#dbeafe; border-color:#93c5fd; color:#1e40af; transform:translateY(-1px); }

  form { display:flex; gap:.6rem; padding:.85rem 1.25rem; background:#fff; border-top:1px solid var(--border); align-items:center; }
  input { flex:1; padding:.8rem 1rem; border:1px solid var(--border); border-radius:10px; font-size:1rem; outline:none; transition:border-color .15s ease, box-shadow .15s ease; background:#f8fafc; }
  input:focus { border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(29,78,216,.12); }
  button.send-btn { padding:.8rem 1.3rem; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:background .15s ease, transform .1s ease; }
  button.send-btn:hover { background:var(--accent-hover); }
  button.send-btn:active { transform:scale(.98); }

  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color:#0f172a; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:#0f172a; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; color:#1e293b; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; color:#334155; }
  .a2text.a2-caption { font-size:.85rem; color:#64748b; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span>🛡️</span>
    <span>CheckGuard</span>
  </div>
  <div class="header-badge">Verification &amp; Risk AI</div>
</header>
<div id="chat-container">
  <div id="log"></div>
  <div class="prompts-bar">
    <button type="button" class="prompt-chip" data-prompt="Verify payroll check for $1,250 from Acme Construction for Alice Johnson drawn on Chase">🔍 Verify Check</button>
    <button type="button" class="prompt-chip" data-prompt="Calculate cashing fee and net payout for a $2,500 commercial check">💵 Calculate Payout</button>
    <button type="button" class="prompt-chip" data-prompt="Show store manager statistics on check volumes, fees, and bounce rates for 2026">📊 Manager Stats</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask CheckGuard about a check, teller rule, or stats…" autocomplete="off" autofocus>
    <button type="submit" class="send-btn">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🛡️");
  const body = el("div", "msg-body");
  
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const meta = el("div", "msg-meta", (who === "user" ? "You" : "CheckGuard") + " • " + timeStr);
  
  const b = el("div", "bubble");
  body.appendChild(meta);
  body.appendChild(b);
  
  row.appendChild(avatar);
  row.appendChild(body);
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendMessage(text) {
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

// Clickable example prompts
document.querySelectorAll(".prompt-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const prompt = chip.getAttribute("data-prompt");
    if (prompt) sendMessage(prompt);
  });
});

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  sendMessage(text);
});
</script>
</body>
</html>
